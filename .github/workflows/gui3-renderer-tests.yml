name: gui3-renderer-tests

on:
  pull_request:
    branches: [GUI3_squashed]
  workflow_dispatch:

jobs:
  gui3-renderer-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # *.unit.mjs suites rely on native TS type-stripping (node >= 22.18)
          node-version: '22.x'
          cache: npm
          cache-dependency-path: src/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: App regression suites
        working-directory: .
        run: node test/app/run-app-regression-tests.cjs

      # Excluded suites are pre-existing red at ab2f9cd7b (stale source-contract
      # regexes, unrelated to fork work); tracked in docs/dev/fork-divergence.md:
      # model-providers, router-editor, global-model-settings,
      # configuration-consistency, directory-settings, model-nav-filters,
      # download-polling, router-load, default-chat-model, model-list-backends
      - name: Renderer runtime suites
        run: |
          npm run test:chat-audio
          npm run test:conversation-rail
          npm run test:conversation-export
          npm run test:conversation-title
          npm run test:chat-file-attachments
          npm run test:model-kinds
          npm run test:mcp-mock
          npm run test:mcp-runtime
          npm run test:router-store
          npm run test:icons
          npm run test:storage
          npm run test:effective-settings
          npm run test:sampler-args
          npm run test:ui-regressions
          npm run test:model-state

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # webpack-dev-server is started by the playwright config; lemond routes are mocked
      - name: Accessibility suite
        run: npm run test:a11y
